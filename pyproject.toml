[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airplane-detector"
version = "2.0.0"
description = "A from-scratch fully-convolutional CNN airplane detector for aerial imagery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shahd M. Elkilany" }]
dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8", "pycocotools>=2.0.8"]
demo = ["gradio>=4.44"]
notebook = ["jupyter", "nbconvert"]

[project.scripts]
airdet = "airplane_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
